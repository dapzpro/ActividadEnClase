<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AdminExpress</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="contenedor">

    <section class="lado-azul">
      <h1>AdminExpress</h1>
    </section>

    <section class="lado-form">
      <form class="formulario">
        <h2>Let's <strong>Sign In</strong> 👋</h2>
        <p class="subtitulo">Hey, Enter your details to get sign in to your account.</p>

        <label for="email">Email</label>
        <div class="campo">
          <span class="icono">✉</span>
          <input type="email" id="email" placeholder="Enter Email">
        </div>

        <label for="password">Password</label>
        <div class="campo">
          <span class="icono">🔒</span>
          <input type="password" id="password" placeholder="Enter Password">
          <span class="icono">👁</span>
        </div>

        <a href="#" class="olvido">Forgot password?</a>

        <button type="submit" class="boton">Sign In</button>

        <p class="registro">Don't have an account? <a href="#">Sign Up</a></p>
      </form>
    </section>

  </div>
</body>
</html>
